# A single `uv run pre-commit install` wires all three stages. Without this the
# commit-stage hooks below are documentation: they run only when someone types
# `uv run pre-commit run --all-files`.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# Every hook below names its stage. A hook with no `stages` key runs at *every*
# installed stage, which would make each push replay the whole commit pipeline
# before the pre-push gates it actually exists for.

repos:
  - repo: local
    hooks:
      # A rewritten lockfile needs restaging before the expensive checks.
      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format (all files)
        entry: uv run ruff format .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check (all files)
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: lint-imports
        name: import-linter (architecture)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: mypy
        name: mypy (all files)
        entry: uv run mypy .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest
        name: pytest (with coverage)
        entry: uv run pytest -n auto --cov --cov-report=term-missing
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: mutmut
        name: mutmut (mutation testing, fast profile)
        entry: uv run python scripts/mutation.py --profile fast
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Reject version drift before paying for mutation or live checks.
      - id: version-drift
        name: version matches the nearest tag
        # project.version is written by semantic-release only; a hand edit shows up
        # as a version no reachable tag carries. Pre-push, not pre-commit: during
        # a release the bump and the tag land together, so the tag exists by push.
        entry: >-
          bash -c 'tag=$(git describe --tags --abbrev=0 2>/dev/null) || { echo "No tag reachable from HEAD."; exit 0; };
          version=$(uv version --short) || exit 1;
          [ "v$version" = "$tag" ] && { echo "Version $version matches tag $tag."; exit 0; };
          echo "FAILED: pyproject.toml has version $version, nearest tag is $tag.";
          echo "The version is written by the release: uv run semantic-release version --no-push --no-vcs-release";
          echo "If this branch predates a release on main, rebase onto main instead."; exit 1'
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true
        stages: [pre-push]

      # The whole gated scope, kept off the commit path because any edit under
      # tests/ invalidates every cached verdict (cache_invalidation_files +
      # on_dependency_change = "rerun"), so a commit that touches a test pays
      # for the full scope.
      - id: mutmut-full
        name: mutmut (mutation testing, full scope)
        entry: uv run python scripts/mutation.py --profile full
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Integration tests need the shared CVAT, MinIO and ClearML stands of the
      # cluster, and this run's CVAT project must be fresh (a reused one fails
      # with "Duplicate base task name"), so the gate owns
      # up -> test -> keep-or-stop and a run costs minutes. Hence pre-push,
      # after the mutation gate.
      #
      # It disables itself when tests/integration/.env is missing, which is the
      # case on a fresh clone and on any machine never set up for integration
      # testing. verbose: true so that notice is visible - pre-commit swallows the
      # output of hooks that pass.
      #
      # Skip it for one push with: SKIP=integration-tests git push
      - id: integration-tests
        name: integration tests (live stands)
        entry: uv run python -m tests.integration.lifecycle gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true

      - id: count-lines
        name: count lines of code
        entry: bash -c 'echo "Lines of code:"; find cveta2 -name "*.py" | xargs wc -l | tail -1'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        verbose: true

      - id: uv-build
        name: uv build (check project is buildable)
        entry: bash -c 'uv build --quiet && rm -rf dist'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # The version, the tag and CHANGELOG.md are derived from commit subjects by
  # python-semantic-release, so a subject outside these types silently drops out
  # of the release. Merge and autosquash subjects stay exempt (non-strict mode).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [build, chore, ci, docs, feat, fix, perf, refactor, style, test]
