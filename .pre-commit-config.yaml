# Hooks run through prek (a pre-commit-compatible runner): `uv run prek install`
# wires the pre-commit and commit-msg stages. Unit checks run at commit time;
# live integration and advisory mutation use explicit manual hooks. History
# rewrites (rebase, cherry-pick, merge) run no hook: re-check with
# `uv run prek run --all-files` after one.
default_install_hook_types: [pre-commit, commit-msg]

# Default hooks run fast to slow; the first failure stops the rest. Live-stand
# and mutation checks are selected separately with --hook-stage manual.
fail_fast: true

# Every hook below names its stage. A hook with no `stages` key runs at every
# installed stage, including commit-msg.
#
# Heavy hooks are path-filtered: a commit touching only Markdown, plans or
# specifications runs ruff and nothing that imports the package. `uv run
# --locked` never re-locks: a stale uv.lock fails instead of being rewritten.

repos:
  - repo: local
    hooks:
      # The lockfile must already match pyproject.toml; nothing re-locks here.
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
        stages: [pre-commit]

      # uv.lock changes only together with pyproject.toml (a dependency edit or
      # a semantic-release bump). A deliberate re-lock alone, such as an upgrade,
      # is a `build(deps):` commit made with SKIP=lockfile-guard.
      - id: lockfile-guard
        name: uv.lock changes only with pyproject.toml
        entry: bash -c 'git diff --cached --name-only | grep -qx uv.lock || exit 0; git diff --cached --name-only | grep -qx pyproject.toml || { echo "uv.lock is staged without pyproject.toml - a deliberate re-lock is a build(deps) commit made with SKIP=lockfile-guard"; exit 1; }'
        language: system
        pass_filenames: false
        files: ^uv\.lock$
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format (all files)
        entry: uv run --locked ruff format .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check (all files)
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: lint-imports
        name: import-linter (architecture)
        entry: uv run --locked lint-imports
        language: system
        pass_filenames: false
        files: ^(cveta2/|tests/|scripts/|main\.py$|pyproject\.toml$|uv\.lock$)
        stages: [pre-commit]

      # The mypy daemon keeps its state between commits (one per worktree,
      # .dmypy.json): warm runs take well under a second. Any daemon failure
      # (type errors or a fine-grained crash) falls back to a fresh full mypy
      # run, which gives the verdict. Run the daemon only on `.`; a path subset
      # can crash its fine-grained mode in third-party stubs.
      - id: mypy
        name: mypy (daemon, all files)
        entry: bash -c 'uv run --locked dmypy run -- . >/dev/null 2>&1 || { uv run dmypy stop >/dev/null 2>&1; uv run --locked mypy .; }' 
        language: system
        pass_filenames: false
        files: ^(cveta2/|tests/|scripts/|main\.py$|pyproject\.toml$|uv\.lock$)
        stages: [pre-commit]

      - id: vulture
        name: vulture (dead code)
        entry: uv run --locked vulture
        language: system
        pass_filenames: false
        files: ^(cveta2/|tests/|scripts/|main\.py$|pyproject\.toml$|uv\.lock$)
        stages: [pre-commit]

      # testmon selects affected unit tests. Ignore the live directory entirely,
      # including its conftest, so default verification never prepares a stand.
      # Staged non-Python fixtures require all unit tests rather than testmon
      # selection. Full-suite coverage remains an explicit merge requirement.
      - id: pytest
        name: pytest (affected unit tests, testmon)
        entry: bash -c 'if git diff --cached --name-only | grep -E "^(cveta2|tests)/" | grep -qvE "\.py$"; then exec uv run --locked pytest --testmon-noselect -m "not integration" --ignore=tests/integration; fi; exec uv run --locked pytest --testmon -m "not integration" --ignore=tests/integration'
        language: system
        pass_filenames: false
        files: ^(cveta2/|tests/|scripts/|main\.py$|pyproject\.toml$|uv\.lock$)
        stages: [pre-commit]

      - id: integration-tests
        name: pytest (live integration, shared stands required)
        entry: uv run --locked pytest tests/integration
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: acceptance-tests
        name: pytest (full acceptance suite with coverage, shared stands required)
        entry: uv run --locked pytest --cov
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: property-exploration
        name: pytest (random property exploration, unit tests only)
        entry: bash -c 'HYPOTHESIS_PROFILE=explore exec uv run --locked pytest -m "not integration" --ignore=tests/integration -p no:randomly'
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: deptry
        name: deptry (declared dependencies)
        entry: uv run --locked deptry .
        language: system
        pass_filenames: false
        files: ^(cveta2/|pyproject\.toml$|uv\.lock$)
        stages: [pre-commit]

      - id: uv-build
        name: uv build (check project is buildable)
        entry: bash -c 'uv build --quiet && rm -rf dist'
        language: system
        pass_filenames: false
        files: ^pyproject\.toml$
        stages: [pre-commit]

      # Mutation testing of the functions this commit changes, in a throwaway
      # workspace (scripts/mutation.py). Advisory: survivors are printed, not
      # fatal; only a tool or clean-test failure fails the hook. verbose so the
      # survivors are visible. Invoke explicitly with --hook-stage manual.
      - id: mutmut
        name: mutmut (changed functions, advisory)
        entry: uv run --locked python scripts/mutation.py
        language: system
        pass_filenames: false
        files: ^cveta2/.*\.py$
        stages: [manual]
        verbose: true

  # The version, the tag and CHANGELOG.md are derived from commit subjects by
  # python-semantic-release, so a subject outside these types silently drops out
  # of the release. Merge and autosquash subjects stay exempt (non-strict mode).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [build, chore, ci, docs, feat, fix, perf, refactor, style, test]
