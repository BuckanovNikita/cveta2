default_install_hook_types:
- pre-commit
- commit-msg
default_stages: [pre-commit]
fail_fast: true
repos:
- repo: local
  hooks:
  - id: verify
    name: Task development verification
    entry: bash scripts/verify-hook.sh
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    verbose: true
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.5.0
  hooks:
  - id: conventional-pre-commit
    stages: [commit-msg]
    args: [build, chore, ci, docs, feat, fix, perf, refactor, style, test]
minimum_prek_version: 0.5.10
