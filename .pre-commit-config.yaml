# A single `uv run pre-commit install` wires both stages. Every check, long ones
# included, runs at commit time, so a commit that passed is safe to push and no
# pre-push hook exists. History rewrites (rebase, cherry-pick, merge) run no
# pre-commit hook: re-check with `uv run pre-commit run --all-files` after one.
default_install_hook_types: [pre-commit, commit-msg]

# Hooks run fast to slow; the first failure stops the rest, so a lint or unit
# failure never spends mutation or live-stand time.
fail_fast: true

# Every hook below names its stage. A hook with no `stages` key runs at every
# installed stage, including commit-msg.

repos:
  - repo: local
    hooks:
      # A rewritten lockfile needs restaging before the expensive checks.
      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format (all files)
        entry: uv run ruff format .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check (all files)
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: lint-imports
        name: import-linter (architecture)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: mypy
        name: mypy (all files)
        entry: uv run mypy .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest
        name: pytest (with coverage)
        entry: uv run pytest -n auto --cov --cov-report=term-missing
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: count-lines
        name: count lines of code
        entry: bash -c 'echo "Lines of code:"; find cveta2 -name "*.py" | xargs wc -l | tail -1'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        verbose: true

      - id: uv-build
        name: uv build (check project is buildable)
        entry: bash -c 'uv build --quiet && rm -rf dist'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Mutation testing of the functions this commit changes, in a throwaway
      # workspace (scripts/mutation.py). Advisory: survivors are printed, not
      # fatal; only a tool or clean-test failure fails the hook. verbose so the
      # survivors are visible - pre-commit hides the output of passing hooks.
      - id: mutmut
        name: mutmut (changed functions, advisory)
        entry: uv run python scripts/mutation.py
        language: system
        pass_filenames: false
        files: ^cveta2/.*\.py$
        stages: [pre-commit]
        verbose: true

      # Live tests on the shared CVAT, MinIO and ClearML stands: up -> test ->
      # keep-or-stop under one run tag, minutes per run, so last. Runs when the
      # package, the integration suite or the dependencies change; skips with a
      # notice on a machine without the k8s-infra skill.
      #
      # Skip it for one commit with: SKIP=integration-tests git commit ...
      - id: integration-tests
        name: integration tests (live stands)
        entry: uv run python -m tests.integration.lifecycle gate
        language: system
        pass_filenames: false
        files: ^(cveta2/|tests/integration/|pyproject\.toml$|uv\.lock$)
        stages: [pre-commit]
        verbose: true

  # The version, the tag and CHANGELOG.md are derived from commit subjects by
  # python-semantic-release, so a subject outside these types silently drops out
  # of the release. Merge and autosquash subjects stay exempt (non-strict mode).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [build, chore, ci, docs, feat, fix, perf, refactor, style, test]
