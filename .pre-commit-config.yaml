repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (all files)
        entry: uv run ruff format .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check (all files)
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-imports
        name: import-linter (architecture)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy (all files)
        entry: uv run mypy .
        language: system
        pass_filenames: false
        always_run: true

      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (with coverage)
        entry: uv run pytest -n auto --cov --cov-report=term-missing --cov-fail-under=65
        language: system
        pass_filenames: false
        always_run: true

      - id: mutmut
        name: mutmut (mutation testing, fast profile)
        entry: ./scripts/mutation_test.sh --profile fast
        language: system
        pass_filenames: false
        always_run: true

      # The whole gated scope, kept off the commit path because any edit under
      # tests/ invalidates every cached verdict (cache_invalidation_files +
      # on_dependency_change = "rerun"), so a commit that touches a test pays
      # for the full scope. Install with:
      #     uv run pre-commit install --hook-type pre-push
      - id: mutmut-full
        name: mutmut (mutation testing, full scope)
        entry: ./scripts/mutation_test.sh --profile full
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: count-lines
        name: count lines of code
        entry: bash -c 'echo "Lines of code:"; find cveta2 -name "*.py" | xargs wc -l | tail -1'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: uv-build
        name: uv build (check project is buildable)
        entry: bash -c 'uv build --quiet && rm -rf dist'
        language: system
        pass_filenames: false
        always_run: true

      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: system
        pass_filenames: false
        always_run: true
