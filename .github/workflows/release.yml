name: Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install release tooling
        run: python -m pip install 'python-semantic-release==10.7.0'
      # semantic-release sets author, committer and tagger from commit_author in
      # pyproject.toml; the push uses the credential actions/checkout stored.
      - name: Version, changelog and tag
        run: python -m scripts.release
