name: Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install release tooling
        run: python -m pip install 'python-semantic-release==10.7.0'
      # semantic-release sets author, committer and tagger from commit_author in
      # pyproject.toml; the push uses the credential actions/checkout stored.
      - name: Version, changelog and tag
        run: semantic-release version --no-vcs-release
