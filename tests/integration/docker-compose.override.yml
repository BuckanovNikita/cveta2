# Override for CVAT integration tests.
#
# Adds MinIO and ClearML. Disables the analytics pipeline.
# Layered on top of CVAT's own docker-compose.yml, which integration_up.sh
# downloads into .cache/cvat/; CVAT_VERSION picks that file and the image tags.
#
# INTEGRATION_USER is set by integration_up.sh (defaults to "default")
# and used as a container-name prefix to avoid clashes between users.
#
# cvat_server publishes its own nginx on CVAT_PORT; traefik and cvat_ui are
# not started, so this stack serves the API only and has no web UI.
#
# traefik.enable is forced to "false" on every service the base compose
# labels. A traefik discovers containers through the Docker socket, not
# through a network, so an unrelated CVAT stack on this machine would
# otherwise adopt these containers into its own `cvat` service (they carry
# identical router/service labels) and load-balance real traffic into them.
# TRAEFIK_PROVIDERS_DOCKER_NETWORK does not prevent this: it only picks
# which IP to use, so the foreign, unreachable endpoint stays in rotation
# and every other request dies on a 30 s dial timeout. Both stacks break.

services:
  cvat_db:
    container_name: ${INTEGRATION_USER:-default}-cvat_db

  cvat_redis_inmem:
    container_name: ${INTEGRATION_USER:-default}-cvat_redis_inmem

  cvat_redis_ondisk:
    container_name: ${INTEGRATION_USER:-default}-cvat_redis_ondisk

  cvat_opa:
    container_name: ${INTEGRATION_USER:-default}-cvat_opa

  cvat_server:
    container_name: ${INTEGRATION_USER:-default}-cvat_server
    environment:
      CVAT_ANALYTICS: 0
    labels:
      traefik.enable: "false"
    ports:
      - "${CVAT_PORT:-8080}:8080"

  cvat_worker_import:
    container_name: ${INTEGRATION_USER:-default}-cvat_worker_import

  cvat_worker_chunks:
    container_name: ${INTEGRATION_USER:-default}-cvat_worker_chunks

  traefik:
    container_name: ${INTEGRATION_USER:-default}-traefik
    ports: !override []
    labels:
      traefik.enable: "false"

  cvat_ui:
    container_name: ${INTEGRATION_USER:-default}-cvat_ui
    labels:
      traefik.enable: "false"

  cveta2-minio:
    container_name: ${INTEGRATION_USER:-default}-cveta2-minio
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - cveta2-minio-data:/data
    networks:
      - cvat
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  clearml-redis:
    container_name: ${INTEGRATION_USER:-default}-clearml-redis
    image: redis:7.4.1
    networks:
      - cvat
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  clearml-mongo:
    container_name: ${INTEGRATION_USER:-default}-clearml-mongo
    image: mongo:7.0.22
    networks:
      - cvat
    volumes:
      - clearml-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  clearml-elastic:
    container_name: ${INTEGRATION_USER:-default}-clearml-elastic
    image: elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    networks:
      - cvat
    volumes:
      - clearml-elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  clearml-fileserver:
    container_name: ${INTEGRATION_USER:-default}-clearml-fileserver
    image: allegroai/clearml:latest
    command: fileserver
    ports:
      - "${CLEARML_FILES_PORT:-8881}:8081"
    environment:
      CLEARML__HOSTS__API_SERVER: "http://clearml-apiserver:8008"
      CLEARML__HOSTS__REDIS__FILESERVER__HOST: "clearml-redis"
      CLEARML__HOSTS__REDIS__FILESERVER__PORT: "6379"
    networks:
      - cvat
    volumes:
      - clearml-fileserver-data:/mnt/fileserver
    depends_on:
      clearml-redis:
        condition: service_healthy

  clearml-apiserver:
    container_name: ${INTEGRATION_USER:-default}-clearml-apiserver
    image: allegroai/clearml:latest
    command: apiserver
    ports:
      - "${CLEARML_API_PORT:-8880}:8008"
    environment:
      CLEARML__HOSTS__MONGO__BACKEND__HOST: "mongodb://clearml-mongo:27017/backend"
      CLEARML__HOSTS__MONGO__AUTH__HOST: "mongodb://clearml-mongo:27017/auth"
      CLEARML__HOSTS__ELASTIC__EVENTS__HOSTS: '[{"host":"clearml-elastic","port":9200,"scheme":"http"}]'
      CLEARML__HOSTS__ELASTIC__WORKERS__HOSTS: '[{"host":"clearml-elastic","port":9200,"scheme":"http"}]'
      CLEARML__HOSTS__REDIS__APISERVER__HOST: "clearml-redis"
      CLEARML__HOSTS__REDIS__APISERVER__PORT: "6379"
      CLEARML__HOSTS__REDIS__WORKERS__HOST: "clearml-redis"
      CLEARML__HOSTS__REDIS__WORKERS__PORT: "6379"
      CLEARML__APISERVER__PRE_POPULATE__ENABLED: "true"
    networks:
      - cvat
    depends_on:
      clearml-redis:
        condition: service_healthy
      clearml-mongo:
        condition: service_healthy
      clearml-elastic:
        condition: service_healthy

  clearml-webserver:
    container_name: ${INTEGRATION_USER:-default}-clearml-webserver
    image: allegroai/clearml:latest
    command: webserver
    ports:
      - "${CLEARML_WEB_PORT:-8882}:80"
    environment:
      NGINX_APISERVER_ADDRESS: "http://clearml-apiserver:8008"
      NGINX_FILESERVER_ADDRESS: "http://clearml-fileserver:8081"
    networks:
      - cvat
    depends_on:
      clearml-apiserver:
        condition: service_started

volumes:
  cveta2-minio-data:
  clearml-mongo-data:
  clearml-elastic-data:
  clearml-redis-data:
  clearml-fileserver-data:
