      labels:
        app.kubernetes.io/part-of: cveta2-integration
        app.kubernetes.io/component: cvat-worker-import
    spec:
      initContainers:
      - name: user-data-permission-fix
        image: busybox:1.36.1
        imagePullPolicy: IfNotPresent
        command:
