apiVersion: batch/v1
kind: Job
metadata:
  name: cvat-backend-initializer
  labels:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-initializer
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cveta2-integration
        app.kubernetes.io/component: cvat-initializer
    spec:
      restartPolicy: OnFailure
      containers:
      - name: cvat-backend
        image: cvat/server:v2.82.0
        imagePullPolicy: IfNotPresent
        args:
        - init
        env:
        - name: ALLOWED_HOSTS
          value: '*'
        - name: CVAT_REDIS_INMEM_HOST
          value: cvat-redis
        - name: CVAT_REDIS_INMEM_PORT
          value: '6379'
        - name: CVAT_REDIS_INMEM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvat-redis-secret
              key: password
        - name: CVAT_REDIS_ONDISK_HOST
          value: cvat-kvrocks
        - name: CVAT_REDIS_ONDISK_PORT
          value: '6666'
        - name: CVAT_REDIS_ONDISK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvat-kvrocks-secret
              key: password
        - name: CVAT_POSTGRES_HOST
          value: cvat-postgresql
        - name: CVAT_POSTGRES_PORT
          value: '5432'
        - name: CVAT_POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: cvat-postgres-secret
              key: username
        - name: CVAT_POSTGRES_DBNAME
          valueFrom:
            secretKeyRef:
              name: cvat-postgres-secret
              key: database
        - name: CVAT_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvat-postgres-secret
              key: password
        - name: CVAT_NUM_PROXIES
          value: '1'
