      containers:
      - name: cvat-backend
        image: cvat/server:v2.82.0
        imagePullPolicy: IfNotPresent
        args:
        - run
        - worker
        - import
        - --with-scheduler
        env:
        - name: ALLOWED_HOSTS
          value: '*'
        - name: CVAT_REDIS_INMEM_HOST
          value: cvat-redis
        - name: CVAT_REDIS_INMEM_PORT
          value: '6379'
        - name: CVAT_REDIS_INMEM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvat-redis-secret
              key: password
        - name: CVAT_REDIS_ONDISK_HOST
          value: cvat-kvrocks
        - name: CVAT_REDIS_ONDISK_PORT
          value: '6666'
        - name: CVAT_REDIS_ONDISK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvat-kvrocks-secret
              key: password
        - name: CVAT_POSTGRES_HOST
          value: cvat-postgresql
        - name: CVAT_POSTGRES_PORT
          value: '5432'
        - name: CVAT_POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: cvat-postgres-secret
              key: username
        - name: CVAT_POSTGRES_DBNAME
          valueFrom:
            secretKeyRef:
              name: cvat-postgres-secret
              key: database
        - name: CVAT_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvat-postgres-secret
              key: password
        - name: CVAT_NUM_PROXIES
          value: '1'
        - name: CVAT_OPA_URL
          value: http://cvat-opa-service:8181
        - name: SMOKESCREEN_OPTS
          value: --unsafe-allow-private-ranges
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NUMPROCS
          value: '1'
        volumeMounts:
        - mountPath: /home/django/data
          name: cvat-backend-data
          subPath: data
        - mountPath: /home/django/keys
          name: cvat-backend-data
          subPath: keys
        - mountPath: /home/django/logs
          name: cvat-backend-data
          subPath: logs
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        livenessProbe:
          exec:
            command:
            - django-admin
            - workerprobe
            - import
            - --expected-num-workers
            - '1'
          initialDelaySeconds: 30
          periodSeconds: 120
          timeoutSeconds: 10
      volumes:
      - name: cvat-backend-data
        persistentVolumeClaim:
          claimName: cvat-backend-data
