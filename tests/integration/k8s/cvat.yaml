# CVAT for one live-test session: the minimal component set the suite needs:
# the backend server, the `import`
# and `chunks` workers (tests read frames with quality="original"), the
# initializer Job (migrations), OPA, Redis, kvrocks and PostgreSQL. No
# frontend, analytics, serverless functions, Ingress or other workers.
#
# Derived from the upstream CVAT Helm chart at v2.82.0 (`helm template` with
# analytics, clickhouse, nuclio, traefik, ingress and the postgresql and redis
# subcharts disabled), then maintained here as plain YAML. lifecycle.py
# applies it with `kubectl -n <session namespace> apply` after quota.yaml and
# after generating the Secrets cvat-postgres-secret, cvat-redis-secret and
# cvat-kvrocks-secret. Everything is emptyDir except the one claim the server
# and both workers share, which names `hostpath`. SMOKESCREEN_OPTS lets the
# backend reach the session MinIO on its private Service address. To move to
# another CVAT version, render the chart at the old and the new tag with the
# same disabled components and port the rendered difference.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cvat-backend-data
  labels:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-data
spec:
  storageClassName: hostpath
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cvat-postgresql
  labels:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-postgresql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-postgresql
  ports:
  - name: tcp
    port: 5432
    targetPort: 5432
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvat-postgresql
  labels:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: cveta2-integration
      app.kubernetes.io/component: cvat-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cveta2-integration
        app.kubernetes.io/component: cvat-postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: cvat-postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvat-postgres-secret
              key: password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: cvat-postgres-secret
              key: database
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 3
          periodSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cvat-redis
  labels:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-redis
  ports:
  - name: tcp
    port: 6379
    targetPort: 6379
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvat-redis
  labels:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: cveta2-integration
      app.kubernetes.io/component: cvat-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cveta2-integration
        app.kubernetes.io/component: cvat-redis
    spec:
      containers:
      - name: redis
        image: public.ecr.aws/docker/library/redis:7.2.11
        imagePullPolicy: IfNotPresent
        args:
        - --requirepass
        - $(REDIS_PASSWORD)
        - --save
        - ''
        - --appendonly
        - 'no'
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvat-redis-secret
              key: password
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
          initialDelaySeconds: 2
          periodSeconds: 3
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cvat-kvrocks
  labels:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-kvrocks
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-kvrocks
  ports:
  - name: tcp
    port: 6666
    targetPort: 6666
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvat-kvrocks
  labels:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-kvrocks
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: cveta2-integration
      app.kubernetes.io/component: cvat-kvrocks
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cveta2-integration
        app.kubernetes.io/component: cvat-kvrocks
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: kvrocks
        image: apache/kvrocks:2.15.0
        imagePullPolicy: IfNotPresent
        args:
        - --requirepass
        - $(CVAT_REDIS_ONDISK_PASSWORD)
        env:
        - name: CVAT_REDIS_ONDISK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvat-kvrocks-secret
              key: password
        ports:
        - containerPort: 6666
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - ./bin/redis-cli -p 6666 PING | grep -E '(PONG|NOAUTH)'
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/kvrocks/db
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cvat-opa-service
  labels:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-opa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-opa
  ports:
  - name: tcp
    port: 8181
    targetPort: 8181
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvat-opa
  labels:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-opa
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: cveta2-integration
      app.kubernetes.io/component: cvat-opa
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cveta2-integration
        app.kubernetes.io/component: cvat-opa
    spec:
      containers:
      - name: opa
        image: openpolicyagent/opa:1.12.2
        imagePullPolicy: IfNotPresent
        args:
        - run
        - --server
        - --addr=:8181
        - --set=decision_logs.console=true
        - --set=services.cvat.url=http://cvat-backend-service:8080
        - --set=bundles.cvat.service=cvat
        - --set=bundles.cvat.resource=/api/auth/rules
        - --set=bundles.cvat.polling.min_delay_seconds=10
        - --set=bundles.cvat.polling.max_delay_seconds=15
        ports:
        - containerPort: 8181
        readinessProbe:
          httpGet:
            port: 8181
            path: /health?bundles
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cvat-backend-service
  labels:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-server
  ports:
  - name: tcp
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvat-backend-server
  labels:
    app.kubernetes.io/part-of: cveta2-integration
    app.kubernetes.io/component: cvat-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: cveta2-integration
      app.kubernetes.io/component: cvat-server
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cveta2-integration
        app.kubernetes.io/component: cvat-server
    spec:
      initContainers:
      - name: user-data-permission-fix
        image: busybox:1.36.1
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        args:
        - chmod -R 777 /home/django
        volumeMounts:
        - mountPath: /home/django/data
          name: cvat-backend-data
          subPath: data
        - mountPath: /home/django/keys
          name: cvat-backend-data
          subPath: keys
        - mountPath: /home/django/logs
          name: cvat-backend-data
          subPath: logs
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: cvat-backend
        image: cvat/server:v2.82.0
        imagePullPolicy: IfNotPresent
        args:
        - run
        - server
        env:
        - name: ALLOWED_HOSTS
          value: '*'
        - name: CVAT_REDIS_INMEM_HOST
          value: cvat-redis
        - name: CVAT_REDIS_INMEM_PORT
          value: '6379'
        - name: CVAT_REDIS_INMEM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvat-redis-secret
              key: password
        - name: CVAT_REDIS_ONDISK_HOST
          value: cvat-kvrocks
        - name: CVAT_REDIS_ONDISK_PORT
          value: '6666'
        - name: CVAT_REDIS_ONDISK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvat-kvrocks-secret
              key: password
        - name: CVAT_POSTGRES_HOST
          value: cvat-postgresql
        - name: CVAT_POSTGRES_PORT
          value: '5432'
        - name: CVAT_POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: cvat-postgres-secret
              key: username
        - name: CVAT_POSTGRES_DBNAME
          valueFrom:
            secretKeyRef:
              name: cvat-postgres-secret
              key: database
        - name: CVAT_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cvat-postgres-secret
              key: password
        - name: CVAT_NUM_PROXIES
          value: '1'
        - name: CVAT_OPA_URL
          value: http://cvat-opa-service:8181
        - name: SMOKESCREEN_OPTS
          value: --unsafe-allow-private-ranges
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - mountPath: /tmp/cvat
          name: cvat-backend-run
        - mountPath: /home/django/static
          name: cvat-backend-static
        - mountPath: /home/django/data
          name: cvat-backend-data
          subPath: data
        - mountPath: /home/django/keys
          name: cvat-backend-data
          subPath: keys
        - mountPath: /home/django/logs
          name: cvat-backend-data
          subPath: logs
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1536Mi
      - name: cvat-nginx
        image: cvat/server:v2.82.0
        imagePullPolicy: IfNotPresent
        args:
        - run
        - nginx
        volumeMounts:
        - mountPath: /tmp/cvat
          name: cvat-backend-run
        - mountPath: /home/django/static
          name: cvat-backend-static
          readOnly: true
        - mountPath: /home/django/data
          name: cvat-backend-data
          subPath: data
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/server/about
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/server/about
            port: 8080
          failureThreshold: 5
          initialDelaySeconds: 60
          periodSeconds: 15
      volumes:
      - name: cvat-backend-run
        emptyDir: {}
      - name: cvat-backend-static
        emptyDir: {}
      - name: cvat-backend-data
        persistentVolumeClaim:
          claimName: cvat-backend-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cvat-backend-worker-import
