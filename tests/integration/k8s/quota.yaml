# Quota and default container resources of one live-test session namespace
# (cveta2-it-<id>). tests/integration/lifecycle.py applies this file first,
# before any workload, and its preflight checks that the node can admit
# `requests.cpu` and `requests.memory` below. Sizes come from measured usage of
# a full live suite, with headroom; every
# container in cvat.yaml, minio.yaml and clearml.yaml declares its own
# requests and limits inside these totals.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cveta2-session
  labels:
    app.kubernetes.io/part-of: cveta2-integration
spec:
  hard:
    pods: "16"
    requests.cpu: "3"
    requests.memory: 6Gi
    limits.memory: 16Gi
    persistentvolumeclaims: "1"
    requests.storage: 5Gi
    requests.nvidia.com/gpu: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cveta2-session
  labels:
    app.kubernetes.io/part-of: cveta2-integration
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "4"
        memory: 4Gi
