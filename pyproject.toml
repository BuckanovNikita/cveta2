[tool.vulture]
min_confidence = 80
paths = ["cveta2", "main.py"]
exclude = ["cveta2/s3_types.py"]

[tool.coverage.run]
source = ["cveta2"]
branch = true
omit = [
    "cveta2/__main__.py",
    "cveta2/s3_types.py",
    "cveta2/commands/setup_clearml.py",
]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.importlinter]
root_packages = ["cveta2"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Core architecture layers"
type = "layers"
layers = [
    "cveta2.cli",
    "cveta2.commands",
    "cveta2.api",
    "cveta2.services",
    "cveta2._clearml",
    "cveta2.client",
    "cveta2._client_ops",
    "cveta2._client",
]
[[tool.importlinter.contracts]]
name = "Foundation modules isolation"
type = "forbidden"
source_modules = [
    "cveta2.models",
    "cveta2.exceptions",
]
forbidden_modules = [
    "cveta2.client",
    "cveta2.api",
    "cveta2.services",
    "cveta2.commands",
    "cveta2.cli",
    "cveta2._client",
]

[[tool.importlinter.contracts]]
name = "Config layer isolation"
type = "forbidden"
source_modules = [
    "cveta2.config",
]
forbidden_modules = [
    "cveta2.client",
    "cveta2.api",
    "cveta2.services",
    "cveta2.commands",
    "cveta2.cli",
    "cveta2._client",
    "cveta2.models",
]

[[tool.importlinter.contracts]]
name = "ClearML layer isolation"
type = "forbidden"
source_modules = ["cveta2._clearml"]
forbidden_modules = [
    "cveta2.client",
    "cveta2.commands",
    "cveta2.cli",
    "cveta2._client",
    "cveta2.models",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
