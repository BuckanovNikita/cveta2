[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cveta2"
version = "0.3.0"
description = "CVAT project annotation utilities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Buckanov Nikita", email = "buckanov32@gmail.com" }]
keywords = ["cvat", "annotations", "dataset", "yolo", "coco", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "boto3>=1.42.49",
    "cvat-sdk>=2.59.1",
    "loguru>=0.7.3",
    "pandas>=2.0.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.0",
    "questionary>=2.0.0",
    "tqdm>=4.66.0",
    "tenacity>=9.1.4",
    "Pillow>=10.0.0",
    "reflink-copy>=0.1.0",
]

[project.optional-dependencies]
clearml = ["clearml>=1.16.0"]

[project.urls]
Homepage = "https://github.com/BuckanovNikita/cveta2"
Repository = "https://github.com/BuckanovNikita/cveta2"
Changelog = "https://github.com/BuckanovNikita/cveta2/blob/main/CHANGELOG.md"
Issues = "https://github.com/BuckanovNikita/cveta2/issues"

[project.scripts]
cveta2 = "cveta2.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cveta2"]

# Without an explicit list hatchling sweeps every file that git does not ignore,
# so tests, scripts and fixtures would ship inside every sdist.
[tool.hatch.build.targets.sdist]
include = [
    "cveta2",
    "README.md",
    "CHANGELOG.md",
    "DATASET_FORMAT.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "boto3-stubs>=1.42.49",
    "mutmut>=3.7.0",
    "mypy>=2.3.0",
    "pandas-stubs>=2.3.3.260113",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20250915",
    "types-tqdm>=4.66.0.20240417",
    "vulture>=2.16",
    "import-linter>=2.13",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "pytest-cov>=7.1.0",
    "python-semantic-release>=10.6.1",
]

[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
# 0.x stays 0.x: a breaking change bumps the minor, never to 1.0.0 on its own.
# Both are spelled out rather than left to the defaults, which have moved
# between python-semantic-release majors.
allow_zero_version = true
major_on_zero = false
# The default release commit message is not a conventional commit, so it would
# fail any later check over the range.
commit_message = "chore(release): {version}"
# A release only moves the version and the tag; it builds no artifact, because
# nothing publishes one. This hook exists solely to keep uv.lock honest:
# uv.lock carries its own cveta2 version entry, which version_toml does not
# touch, so without the re-lock the tagged commit ships a lockfile that
# disagrees with pyproject.toml and the next `uv run` silently re-locks.
# `git add` is what puts the lockfile inside the release commit instead of
# leaving it dirty after.
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""

[tool.semantic_release.changelog]
# The release commit itself, and the two types that describe no change a reader
# of the changelog can act on.
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
]

[tool.ruff]
target-version = "py310"
line-length = 88
# vendor/ is no longer part of the repo; the entry stays for clones made while
# vendor/cvat was still a submodule, which keep the checkout on disk.
exclude = ["vendor/**", "local/**", "mutants/**"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # missing-trailing-comma - conflicts with ruff formatter
    "ISC001",  # single-line-implicit-string-concatenation - conflicts with formatter
    "EM",      # flake8-errmsg - overly pedantic for small projects
    "TRY003",  # raise-vanilla-args - same as EM
    "D213",
    "D203",
    "RUF001",  # ambiguous-unicode-character - project uses Russian (Cyrillic) strings
    "PERF203", # try-except-in-loop - false positive in modern Python (3.11+)
    "CPY001",  # missing-copyright-notice - this project ships no per-file headers
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
# tomllib is stdlib from 3.11 on. Ruff classifies against `target-version`,
# which is py310 for the package; only the dev scripts import it, and they
# run on the pinned interpreter in .python-version.
extra-standard-library = ["tomllib"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN401", "PLR2004", "PLC0415", "D101", "D102", "D103", "S311", "SLF001"]
# Standalone operator scripts: `print` is their output, an argparse `main()`
# is linear top-to-bottom by nature, and their helpers are not an API surface.
"scripts/*.py" = ["T201", "D103", "ANN401", "PLR2004", "S607", "C901", "PLR0912", "PLR0915", "PLR0913", "PLR0917"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
# Must match the floor of the *installed* dependency set, not `requires-python`.
# uv resolves pandas 3.0 / pandas-stubs 3.0 for Python >= 3.11; those stubs
# degrade DataFrame to `Any` when analysed as 3.10, silently disabling all
# pandas type checking. Python 3.10 installs resolve pandas 2.3 instead.
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
# mutants/ holds mutmut's copy of the tree; without it mypy sees two `cveta2`
# packages and fails with a duplicate-module error. vendor/ is only a leftover
# CVAT checkout in older clones - mypy, unlike ruff, ignores .gitignore.
exclude = ["vendor/", "local/", "mutants/"]

[[tool.mypy.overrides]]
module = ["cvat_sdk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["clearml.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "-n", "auto", "-p", "tests.env_isolation"]
markers = [
    "integration: requires running CVAT instance (only active when CVAT_INTEGRATION_HOST is set)",
]

[tool.mutmut]
source_paths = ["cveta2"]
# Ratchet: a module joins this list in the same commit that takes it to zero
# survivors, so the pre-commit hook is never red on main.
only_mutate = [
    "cveta2/dataset_partition.py",
    "cveta2/_client/connection.py",
    "cveta2/services/whats_new.py",
    "cveta2/services/resolve.py",
    "cveta2/_client/extractors.py",
    "cveta2/_client/assembly.py",
    "cveta2/models.py",
    "cveta2/s3_utils.py",
    "cveta2/projects_cache.py",
    "cveta2/services/merge.py",
    "cveta2/services/output.py",
    "cveta2/task_cache.py",
    "cveta2/image_downloader.py",
    "cveta2/image_uploader.py",
    "cveta2/_client_ops/write.py",
    "cveta2/_client_ops/task_ops.py",
    "cveta2/_client_ops/fetch.py",
    "cveta2/_client_ops/read.py",
    "cveta2/_client/sdk_convert.py",
    "cveta2/_client/sdk_requests.py",
    "cveta2/services/upload.py",
    "cveta2/services/convert/common.py",
    "cveta2/services/convert/coco.py",
    "cveta2/services/convert/yolo.py",
    "cveta2/config.py",
    "cveta2/api.py",
    "cveta2/_client_ops/base.py",
    "cveta2/_client_ops/images.py",
    "cveta2/commands/_helpers.py",
    "cveta2/commands/interactive/primitives.py",
    "cveta2/commands/upload.py",
    "cveta2/services/fetch.py",
    "cveta2/_concurrency.py",
    "cveta2/upload_manifest.py",
]
# `-n 0` is mandatory: mutmut runs pytest.main() inside each forked child and
# the global addopts `-n auto` would spawn a full xdist pool per mutant. These
# args are appended last, so this `-n` wins.
pytest_add_cli_args = ["-n", "0", "-p", "no:cacheprovider", "--no-cov"]
pytest_add_cli_args_test_selection = ["tests/"]
# Presentation is not behaviour. Log lines, progress bars and the text of a
# `sys.exit` are things a person reads, and the only test that can kill a
# mutation of them is one that pins their wording - a change-detector that
# makes every copy edit a test edit.
#
# These patterns are the ONE place that exclusion is declared. Do not instead
# restructure source to hide a literal from the mutation gate: hoisting a
# progress-bar caption into a module-level constant works (mutmut only mutates
# code inside a top-level function), but it buys a green gate by making the
# code worse, and every later feature pays the cost of the indirection.
# Presentation surface belongs here; if a new one appears, add it here.
#
# Matching is `re.search` per line, and a matched line skips every *expression*
# starting on it together with its children - so `for x in tqdm(items, ...)`
# suppresses the bar and its keywords without touching the loop body. The
# logger pattern stays line-anchored because a bare `logger.` can appear
# mid-expression; `tqdm(`/`sys.exit(` cannot.
#
# Individual equivalent mutants still go in [tool.cveta2.mutation.equivalent] -
# both suppression mechanisms key on the first line of the mutated node, so
# neither can single out one argument of a multi-line call.
do_not_mutate_patterns = [
    "^\\s*logger\\.[a-z_]+\\(",
    "\\btqdm\\(",
    "\\bsys\\.exit\\(",
    # Progress-bar captions. `\btqdm(` covers the single-line bars, but the
    # shared fan-out takes its caption as one argument of a multi-line
    # `run_concurrent` / `run_s3_transfers` call, which starts on a line of
    # its own. Patterns are re.search per line and skip every expression
    # starting on the matched line, so naming the argument reaches exactly
    # the caption and nothing else. Every `desc=`/`unit=` in the package is
    # a bar caption; grep before adding a third meaning.
    "^\\s*desc=",
    "^\\s*unit=",
    # Same family: the progress bar's own advance call.
    "^\\s*bar\\.update\\(",
]
# mutmut caches a mutant's verdict against the *source* function's text, so a
# changed test does not invalidate it: weakening an assertion otherwise leaves
# the gate green on stale results. Hashing the test tree and rerunning on any
# change is what makes the cached run trustworthy.
cache_invalidation_files = ["tests/**/*.py", "conftest.py"]
on_dependency_change = "rerun"
# mutate_only_covered_lines is deliberately left off: its coverage pre-pass
# leaves a half-imported numpy in sys.modules, so the following stats run dies
# with "Unable to import required dependency numpy". Not needed here anyway -
# the scoped modules report zero no-tests mutants without it.

# Which mutants each hook runs. `fast` is the pre-commit subset; `full` is
# empty on purpose, meaning "no positional filter" - mutmut honours a cached
# verdict only when no mutant name is passed, so spelling it '*' would
# re-execute the whole scope every time instead of reusing the cache.
#
# Membership is chosen so `fast` stays meaningfully quicker than `full` -
# putting every gated module in `fast` once measured the same as `full`, i.e.
# the split bought nothing. mutation_test.sh prints the count and elapsed time
# of each run; when a newly gated module erases the gap again, leave it to
# `full`.
[tool.cveta2.mutation.profiles]
fast = [
    "cveta2.dataset_partition.*",
    "cveta2._client.connection.*",
    "cveta2.services.whats_new.*",
    "cveta2.services.resolve.*",
    "cveta2._client.assembly.*",
    "cveta2.models.*",
    "cveta2.projects_cache.*",
]
# _client.extractors is gated but deliberately absent from `fast`: most of its
# mutants land on the keyword arguments of one BBoxAnnotation constructor
# and die on pydantic validation rather than on any assertion, so they cost a
# full suite run each and say nothing about test quality.
full = []

# Mutants that no test can kill because the mutation genuinely cannot change
# behaviour. scripts/mutation_gate.py subtracts these from the survivor set and
# fails if an entry stops matching a live survivor, so a stale justification
# cannot silently widen the gate.
[tool.cveta2.mutation.equivalent]
# _ClientBase.__exit__: the traceback is the one element of the exit triple no
# downstream __exit__ can distinguish. ExitStack forwards the triple verbatim
# to contextlib._GeneratorContextManager.__exit__, which re-raises inside the
# open_sdk_api generator; the exception object carries its own __traceback__
# either way, so the SDK client's __exit__ was measured to observe an identical
# (type, value, tb). On 3.12+ the argument is not even read - that branch is
# `self.gen.throw(value)`. Blanking exc_type or exc_val IS observable and both
# are killed by test_exit_forwards_the_original_exception_to_the_sdk_client.
"cveta2._client_ops.base.xǁ_ClientBaseǁ__exit____mutmut_6" = "exc_tb=None; the re-raised exception carries its own traceback, so the SDK client's __exit__ sees the same triple"

# commands.upload._select_labels: questionary.Choice.__init__ assigns
# `self.value = title` whenever value is None, and these label choices set
# title == value, so both mutations build a byte-identical Choice. The
# no-annotation choice below, where title and value genuinely differ, is
# pinned by test_unannotated_frames_get_a_sentinel_choice.
"cveta2.commands.upload.x__select_labels__mutmut_11" = "value=None; questionary.Choice falls back to title, which is the same label"
"cveta2.commands.upload.x__select_labels__mutmut_13" = "drops value=; questionary.Choice falls back to title, which is the same label"


# convert/common: the reflink warning names its cause, _warned is only ever
# read for truthiness, and dict.fromkeys already defaults its value to None.
"cveta2.services.convert.common.xǁ_OnceWarnerǁ__init____mutmut_1" = "_warned=None is falsy; the only read is `if not self._warned`"
"cveta2.services.convert.common.x__reflink_or_fallback_copy__mutmut_10" = "error=None; the OSError only names the cause in the one-time warning, and the fallback copy itself is tested"
"cveta2.services.convert.common.x__make_csv_row_base__mutmut_4" = "drops the fromkeys default, which is None already"

# _write_dataset_yaml / _write_coco_split: the serializer kwargs live in the
# module-level _YAML_DUMP / _JSON_DUMP mappings precisely so their literals are
# not mutated; only dropping the whole mapping is left, and yaml.safe_load /
# json.load are blind to flow style, indentation and \\u escaping alike.
"cveta2.services.convert.yolo.x__write_dataset_yaml__mutmut_26" = "drops **_YAML_DUMP; safe_load reads flow style and escaped non-ASCII identically"
"cveta2.services.convert.coco.x__write_coco_split__mutmut_152" = "drops **_JSON_DUMP; json.load reads unindented and escaped output identically"

# _from_yolo_predictions: the stem only reaches the warning text; how many
# files were skipped, and that the walk resumes, are both asserted.
"cveta2.services.convert.yolo.x__from_yolo_predictions__mutmut_34" = "appends None instead of the stem; preview_names str()s it into the warning and nothing else reads the list"

# _write_coco_split: COCO only requires ids to be unique and consistent within
# a file, and the annotation -> image / category linkage is asserted by id
# lookup rather than by absolute value. Duplicate ids (ann_id = 1) and negative
# ones (ann_id -= 1) DO break the format and are killed.
"cveta2.services.convert.coco.x__write_coco_split__mutmut_10" = "drops enumerate start, numbering images from 0; every image_id reference follows"
"cveta2.services.convert.coco.x__write_coco_split__mutmut_14" = "start=2; every image_id reference follows"
"cveta2.services.convert.coco.x__write_coco_split__mutmut_50" = "ann_id starts at 1 so the first annotation is 2; ids stay unique and positive"
"cveta2.services.convert.coco.x__write_coco_split__mutmut_77" = "ann_id += 2; ids stay unique, positive and ascending"
"cveta2.services.convert.coco.x__write_coco_split__mutmut_56" = "continue -> break on an unmapped image name; image_id_map is built from split_df's unique names and split_boxes is a subset, so the guard never fires"
"cveta2.services.convert.coco.x__write_coco_split__mutmut_130" = "key=None sorts by (name, id); prepare_export assigns ids in name-sorted order, so both orders coincide"
"cveta2.services.convert.coco.x__write_coco_split__mutmut_132" = "drops key=; same coincidence of name order and id order"

# convert_to_coco: prepare_export already created output_dir with parents=True,
# so split_dir's parent always exists. exist_ok IS load-bearing (a second run
# into the same tree) and is killed by test_nested_output_dir_and_rerun.
"cveta2.services.convert.coco.x_convert_to_coco__mutmut_27" = "parents=None; split_dir's parent is the output dir prepare_export just created"
"cveta2.services.convert.coco.x_convert_to_coco__mutmut_29" = "drops parents=; split_dir's parent is the output dir prepare_export just created"
"cveta2.services.convert.coco.x_convert_to_coco__mutmut_31" = "parents=False; split_dir's parent is the output dir prepare_export just created"

# config._env_flag: the `""` default is read only when the variable is unset,
# and no spelling of an absent value lowercases to a trigger token.
"cveta2.config.x__env_flag__mutmut_6" = "default \"XXXX\"; like \"\" it lowercases to something no caller compares against"

# config.SectionConfig._dump: pydantic-core switches on `mode == "python"`, so
# every other spelling - including a mangled one - takes the JSON branch.
# mode=None and the dropped argument DO reach python mode and die on
# yaml.safe_dump, which has no representer for the Path values in image_cache.
"cveta2.config.xǁSectionConfigǁ_dump__mutmut_5" = "mode=\"XXjsonXX\"; any mode other than \"python\" serializes as JSON"
"cveta2.config.xǁSectionConfigǁ_dump__mutmut_6" = "mode=\"JSON\"; any mode other than \"python\" serializes as JSON"


# task_cache: `_disable(e)` / `source=` only name the cause or the cache layer
# inside a warning; the disabling and the miss themselves are pinned by tests.
"cveta2.task_cache.xǁS3CacheBackendǁ__init____mutmut_6" = "_disabled=None is falsy; the only read is `if self._disabled`"
"cveta2.task_cache.xǁS3CacheBackendǁget__mutmut_11" = "_disable(None) on the ClientError path; the error only names the cause in the warning"
"cveta2.task_cache.xǁS3CacheBackendǁget__mutmut_12" = "_disable(None) on the BotoCoreError path; the error only names the cause in the warning"
"cveta2.task_cache.xǁS3CacheBackendǁput__mutmut_10" = "_disable(None) on the upload path; the error only names the cause in the warning"
"cveta2.task_cache.xǁTaskAnnotationCacheǁ_get_local__mutmut_6" = "source=None; the layer label only reaches the rejection log"
"cveta2.task_cache.xǁTaskAnnotationCacheǁ_get_s3__mutmut_8" = "source=None; the layer label only reaches the rejection log"

# Image IO. Bar captions are now excluded by the `desc=`/`unit=` line
# patterns above. The rest are counters assigned rather than incremented
# where the counter is provably still zero at that point.
"cveta2.image_downloader.x__download_pending__mutmut_22" = "stats.downloaded = ok; _download_pending is the only writer of `downloaded` and runs once per stats object"
"cveta2.image_downloader.xǁImageDownloaderǁ_download_all__mutmut_2" = "stats.failed = len(pending); the no-storage branch returns before any transfer, so failed is still 0"
"cveta2.image_downloader.xǁImageDownloaderǁ_download_all__mutmut_33" = "stats.failed = len(missing); the misses are counted before any transfer runs, so failed is still 0"
"cveta2.image_downloader.x_parse_cloud_storage__mutmut_11" = "or \"XXXX\"; parse_qs of a string with no \"=\" yields {} exactly as for \"\""
"cveta2.image_uploader.xǁS3Uploaderǁupload__mutmut_13" = "prefix=None widens the listing with out-of-prefix keys that no computed s3_key can equal"

# Bar captions, second half. The `desc=`/`unit=` line patterns kill the
# mutants that rewrite the caption *text*, but not the one that drops the
# whole keyword argument: `desc=None` replaces the argument node itself,
# which mutmut attributes to the enclosing call rather than to the line the
# pattern matched. tqdm then renders the bar with no caption and nothing
# else changes.
"cveta2.image_downloader.x__download_pending__mutmut_5" = "desc=None; tqdm renders the bar with no caption, nothing else changes"
"cveta2.image_downloader.xǁImageDownloaderǁ_filter_cached__mutmut_8" = "desc=None; tqdm renders the bar with no caption, nothing else changes"
"cveta2.image_uploader.xǁS3Uploaderǁupload__mutmut_43" = "desc=None; tqdm renders the bar with no caption, nothing else changes"
"cveta2.s3_utils.x_list_s3_objects__mutmut_29" = "desc=None; tqdm renders the bar with no caption, nothing else changes"
"cveta2.services.fetch.x__fetch_and_save_tasks__mutmut_37" = "desc=None; tqdm renders the bar with no caption, nothing else changes"
"cveta2._client_ops.task_ops.xǁ_TaskOpsMixinǁset_task_jobs_status__mutmut_15" = "desc=None; tqdm renders the bar with no caption, nothing else changes"
"cveta2._client_ops.write.xǁ_WriteMixinǁcreate_task_issues__mutmut_32" = "desc=None; tqdm renders the bar with no caption, nothing else changes"
"cveta2._client_ops.fetch.x__resolve_selected_tasks_by_id__mutmut_12" = "desc=None; tqdm renders the bar with no caption, nothing else changes"
"cveta2.image_downloader.xǁImageDownloaderǁ_probe_expected_keys__mutmut_13" = "desc=None; tqdm renders the bar with no caption, nothing else changes"

# run_concurrent returns exactly one outcome per item — that is its documented
# contract and TestOrdering pins it — so the zip that pairs them back up can
# never see a length mismatch and `strict=` can never fire. Killing these
# would mean faking a run_concurrent that violates its own contract.
"cveta2.s3_utils.x_run_s3_transfers__mutmut_17" = "zip strict=None; lengths are equal by construction, so no spelling of strict changes anything"
"cveta2.s3_utils.x_run_s3_transfers__mutmut_20" = "zip strict dropped; lengths are equal by construction"
"cveta2.s3_utils.x_run_s3_transfers__mutmut_21" = "zip strict=False; lengths are equal by construction"
"cveta2.image_downloader.xǁImageDownloaderǁ_filter_cached__mutmut_25" = "zip strict=None; lengths are equal by construction"
"cveta2.image_downloader.xǁImageDownloaderǁ_filter_cached__mutmut_28" = "zip strict dropped; lengths are equal by construction"
"cveta2.image_downloader.xǁImageDownloaderǁ_filter_cached__mutmut_29" = "zip strict=False; lengths are equal by construction"
"cveta2.image_downloader.xǁImageDownloaderǁ_probe_expected_keys__mutmut_33" = "zip strict=None; lengths are equal by construction"
"cveta2.image_downloader.xǁImageDownloaderǁ_probe_expected_keys__mutmut_37" = "zip strict dropped; lengths are equal by construction"
"cveta2.image_downloader.xǁImageDownloaderǁ_probe_expected_keys__mutmut_38" = "zip strict=False; lengths are equal by construction"

# _probe_expected_keys: the value it records for an unresolved image is the
# frame name the fallback listing looks up first. A listing name IS its key
# with the storage prefix stripped, and the probe checked exactly
# build_s3_key(prefix, frame_ref) - so a frame name the listing could resolve
# by full path is one the probe already found, and this lookup is dead on the
# probe path. The lookup itself is load-bearing on the over-limit path, where
# unresolved is `pending` itself, and is killed there by
# test_the_listing_prefers_the_frame_path_over_a_same_named_file.
"cveta2.image_downloader.xǁImageDownloaderǁ_probe_expected_keys__mutmut_42" = "records None instead of the frame name; every name the listing resolves by full path was already found by the probe"

# pandas lowercases the `orient` argument before dispatching on it, so every
# spelling of "records" that differs only in case is the same call.
"cveta2._client.assembly.x_build_task_issues__mutmut_4" = "to_dict(\"RECORDS\"); pandas lower-cases orient, so this is the same call as \"records\""
"cveta2._client.assembly.x_build_upload_shapes__mutmut_11" = "to_dict(\"RECORDS\"); pandas lower-cases orient, so this is the same call as \"records\""

# _filter_cached: catch=() means a stat failure aborts the fetch rather than
