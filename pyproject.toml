# _fetch_core -> prepare_fetch(project_name=): FetchContext.project_name has a
# single reader, the 5xx skip hint in _client_ops.shared, which falls back to a
# "<имя_проекта>" placeholder when it is empty. Killing this means asserting the
# wording of that hint - the change-detector CLAUDE.md rules out.
"cveta2.services.fetch.x__fetch_core__mutmut_9" = "project_name=None; the only reader is the 5xx hint's `if ctx.project_name` fallback"
"cveta2.services.fetch.x__fetch_core__mutmut_15" = "drops project_name=; same single reader as above"

# The baseline consumes numeric task IDs, boolean completion and fixed job
# stage/state values. CSV text options do not change these values for valid
# generated CSVs; pandas also defaults to UTF-8. The full dataset and image
# exclusion readers DO need these options to preserve textual identifiers.
"cveta2.services.whats_new.x__known_task_ids__mutmut_13" = "drops CSV_READ_OPTIONS; numeric task IDs, completion booleans and fixed job statuses are parsed identically by pandas defaults"

# task_to_records: `ctx.frame_issues.get(fid, ("", ""))[N]` reads one fixed
# element of the default tuple, so mutating the *other* element cannot be
# observed. The element each expression does read is pinned by
# TestTaskToRecords::test_unannotated_frames_default_to_blank_issue_fields.
"cveta2._client.assembly.x_task_to_records__mutmut_93" = "issue_text takes [0]; the mutation changes the unread [1] of the default"
"cveta2._client.assembly.x_task_to_records__mutmut_99" = "issue_state takes [1]; the mutation changes the unread [0] of the default"

# Resume compares coordinate sequences only after verifying equal lengths.

# Recovery errors include task/project IDs; the following fixed explanatory
# sentence is presentation only, and tests pin rejection without writes.

# Pandas iteration keeps the same unpacked values and tuple identity under
# these representation changes. Adding an index DOES change behavior.
"cveta2.services.convert.yolo.x__prune_yolo_output__mutmut_3" = "itertuples index=None and index=False both omit the DataFrame index"
"cveta2.services.convert.yolo.x__prune_yolo_output__mutmut_5" = "default namedtuples unpack into the same image_name and split values as name=None tuples"

# Known task membership now determines whats-new; the old cutoff argument is
# retained by CvatClient for compatibility and read only by a trace message.
"cveta2.api.x_whats_new__mutmut_21" = "cutoff=None affects only the client's trace; task membership and returned baseline cutoff are unchanged"

# _latest_row_per_image: pandas' multi-key sort_values is stable on its own, so
# _row_order only makes the intent explicit; keep="first" is the default.
"cveta2.dataset_partition.x__latest_row_per_image__mutmut_6" = "_row_order=None; the two-key sort_values path is already stable"
"cveta2.dataset_partition.x__latest_row_per_image__mutmut_20" = "drops keep=\"first\", which is the drop_duplicates default"

# _latest_task_per_image: the pre-dedup only trims work, and the concatenated
# frame is immediately re-indexed by image_name.
"cveta2.dataset_partition.x__latest_task_per_image__mutmut_2" = "drop_duplicates over all columns; _latest_row_per_image dedups by image_name anyway"
"cveta2.dataset_partition.x__latest_task_per_image__mutmut_3" = "_is_deleted=None instead of 0; the column is only ever compared against 1"
"cveta2.dataset_partition.x__latest_task_per_image__mutmut_17" = "ignore_index=None; set_index(\"image_name\") replaces the index next"
"cveta2.dataset_partition.x__latest_task_per_image__mutmut_19" = "drops ignore_index; set_index(\"image_name\") replaces the index next"
"cveta2.dataset_partition.x__latest_task_per_image__mutmut_20" = "ignore_index=False; set_index(\"image_name\") replaces the index next"

# _split_completed: latest_completed is derived from the left frame, so every
# key matches and image_name is the only column the two share.
"cveta2.dataset_partition.x__split_completed__mutmut_14" = "on=None falls back to the shared columns, which is exactly image_name"
"cveta2.dataset_partition.x__split_completed__mutmut_17" = "drops on=; the shared columns are exactly image_name"
"cveta2.dataset_partition.x__split_completed__mutmut_18" = "drops how=\"left\"; an inner join matches every row and keeps left order"

# partition_annotations_df: obsolete is reset_index(drop=True)'d on the way out.
"cveta2.dataset_partition.x_partition_annotations_df__mutmut_58" = "ignore_index=None; the result is reset_index(drop=True)'d before return"
"cveta2.dataset_partition.x_partition_annotations_df__mutmut_60" = "drops ignore_index; the result is reset_index(drop=True)'d before return"
"cveta2.dataset_partition.x_partition_annotations_df__mutmut_61" = "ignore_index=False; the result is reset_index(drop=True)'d before return"

[tool.vulture]
min_confidence = 80
paths = ["cveta2", "main.py", "tests", "scripts"]
exclude = ["cveta2/s3_types.py"]

[tool.coverage.run]
source = ["cveta2"]
branch = true
omit = [
    "cveta2/__main__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.importlinter]
root_packages = ["cveta2"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Core architecture layers"
type = "layers"
layers = [
    "cveta2.cli",
    "cveta2.commands",
    "cveta2.api",
    "cveta2.services",
    "cveta2._clearml",
    "cveta2.client",
    "cveta2._client_ops",
    "cveta2._client",
]
[[tool.importlinter.contracts]]
name = "Foundation modules isolation"
type = "forbidden"
source_modules = [
    "cveta2.models",
    "cveta2.exceptions",
]
forbidden_modules = [
    "cveta2.client",
    "cveta2.api",
    "cveta2.services",
    "cveta2.commands",
    "cveta2.cli",
    "cveta2._client",
]

[[tool.importlinter.contracts]]
name = "Config layer isolation"
type = "forbidden"
source_modules = [
    "cveta2.config",
]
forbidden_modules = [
    "cveta2.client",
    "cveta2.api",
    "cveta2.services",
    "cveta2.commands",
    "cveta2.cli",
    "cveta2._client",
    "cveta2.models",
]

[[tool.importlinter.contracts]]
name = "ClearML layer isolation"
type = "forbidden"
source_modules = ["cveta2._clearml"]
forbidden_modules = [
    "cveta2.client",
    "cveta2.commands",
    "cveta2.cli",
    "cveta2._client",
    "cveta2.models",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
