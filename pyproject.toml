[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cveta2"
version = "0.1.0"
description = "CVAT project annotation utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.42.49",
    "cvat-sdk>=2.41.0",
    "loguru>=0.7.3",
    "pandas>=2.0.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.0",
    "types-pyyaml>=6.0.12.20250915",
    "questionary>=2.0.0",
    "tqdm>=4.66.0",
    "tenacity>=9.1.4",
    "Pillow>=10.0.0",
    "reflink-copy>=0.1.0",
]

[project.optional-dependencies]
clearml = ["clearml>=1.16.0"]

[project.scripts]
cveta2 = "cveta2.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs>=1.42.49",
    "mutmut>=3.7.0",
    "mypy>=2.3.0",
    "pandas-stubs>=2.3.3.260113",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
    "types-tqdm>=4.66.0.20240417",
    "vulture>=2.16",
    "import-linter>=2.13",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["vendor/**", "local/**", "mutants/**"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # missing-trailing-comma - conflicts with ruff formatter
    "ISC001",  # single-line-implicit-string-concatenation - conflicts with formatter
    "EM",      # flake8-errmsg - overly pedantic for small projects
    "TRY003",  # raise-vanilla-args - same as EM
    "D213",
    "D203",
    "RUF001",  # ambiguous-unicode-character - project uses Russian (Cyrillic) strings
    "PERF203", # try-except-in-loop - false positive in modern Python (3.11+)
    "PLR2004",
    "CPY001",  # missing-copyright-notice - this project ships no per-file headers
]
fixable = ["ALL"]
exclude = ["scripts/**"]  # lint only; format still runs on scripts

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN401", "PLR2004", "PLC0415", "D101", "D102", "D103", "S311", "SLF001"]
"main.py" = ["F401"]  # re-export wrapper

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
# Must match the floor of the *installed* dependency set, not `requires-python`.
# uv resolves pandas 3.0 / pandas-stubs 3.0 for Python >= 3.11; those stubs
# degrade DataFrame to `Any` when analysed as 3.10, silently disabling all
# pandas type checking. Python 3.10 installs resolve pandas 2.3 instead.
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
# mutants/ holds mutmut's copy of the tree; without it mypy sees two `cveta2`
# packages and fails with a duplicate-module error.
exclude = ["scripts/", "vendor/", "local/", "mutants/"]

[[tool.mypy.overrides]]
module = ["cvat_sdk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["clearml.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "-n", "auto", "-p", "tests.env_isolation"]
markers = [
    "integration: requires running CVAT instance (only active when CVAT_INTEGRATION_HOST is set)",
]

[tool.mutmut]
source_paths = ["cveta2"]
# Ratchet: a module joins this list in the same commit that takes it to zero
# survivors, so the pre-commit hook is never red on main.
only_mutate = [
    "cveta2/dataset_partition.py",
    "cveta2/_client/connection.py",
]
# `-n 0` is mandatory: mutmut runs pytest.main() inside each forked child and
# the global addopts `-n auto` would spawn a full xdist pool per mutant. These
# args are appended last, so this `-n` wins.
pytest_add_cli_args = ["-n", "0", "-p", "no:cacheprovider", "--no-cov"]
pytest_add_cli_args_test_selection = ["tests/"]
# Logging is diagnostics, not behaviour, at every level. Mutating it buys
# nothing measurable here: mutmut's string operator fires only on
# cst.SimpleString, and this project logs exclusively through f-strings
# (cst.FormattedString), so the Russian message text was never mutated in the
# first place. What is left per call site is the whole-argument-to-None mutant,
# which no assertion can kill without pinning prose. Suppressing the call is
# the honest way to say that.
#
# The pattern is line-anchored so it cannot silence an unrelated expression
# that happens to share a line with a logger call. Matching only the first line
# is enough for multi-line calls: mutmut skips any expression *starting* on a
# matched line together with all of its children.
#
# Individual equivalent mutants still go in [tool.cveta2.mutation.equivalent] -
# both of mutmut's suppression mechanisms key on the first line of the mutated
# node, so neither can single out one argument of a multi-line call.
do_not_mutate_patterns = ["^\\s*logger\\.[a-z_]+\\("]
# mutmut caches a mutant's verdict against the *source* function's text, so a
# changed test does not invalidate it: weakening an assertion otherwise leaves
# the gate green on stale results. Hashing the test tree and rerunning on any
# change is what makes the cached run trustworthy.
cache_invalidation_files = ["tests/**/*.py", "conftest.py"]
on_dependency_change = "rerun"
# mutate_only_covered_lines is deliberately left off: its coverage pre-pass
# leaves a half-imported numpy in sys.modules, so the following stats run dies
# with "Unable to import required dependency numpy". Not needed here anyway -
# the scoped modules report zero no-tests mutants without it.

# Which mutants each hook runs. `fast` is the pre-commit subset; `full` is
# empty on purpose, meaning "no positional filter" - mutmut honours a cached
# verdict only when no mutant name is passed, so spelling it '*' would
# re-execute the whole scope every time instead of reusing the cache.
#
# Measured on this machine (571 mutants over 6 modules): ~120 mutants/second,
# ~4.5s of fixed overhead per run, 11s cold, 4.7s when every verdict is cached.
# Execution is cheap and the overhead dominates, so keep modules in `fast`
# until it approaches ~20s rather than splitting pre-emptively.
[tool.cveta2.mutation.profiles]
fast = [
    "cveta2.dataset_partition.*",
    "cveta2._client.connection.*",
]
full = []

# Mutants that no test can kill because the mutation genuinely cannot change
# behaviour. scripts/mutation_gate.py subtracts these from the survivor set and
# fails if an entry stops matching a live survivor, so a stale justification
# cannot silently widen the gate.
[tool.cveta2.mutation.equivalent]
# _latest_row_per_image: pandas' multi-key sort_values is stable on its own, so
# _row_order only makes the intent explicit; keep="first" is the default.
"cveta2.dataset_partition.x__latest_row_per_image__mutmut_6" = "_row_order=None; the two-key sort_values path is already stable"
"cveta2.dataset_partition.x__latest_row_per_image__mutmut_20" = "drops keep=\"first\", which is the drop_duplicates default"

# _latest_task_per_image: the pre-dedup only trims work, and the concatenated
# frame is immediately re-indexed by image_name.
"cveta2.dataset_partition.x__latest_task_per_image__mutmut_2" = "drop_duplicates over all columns; _latest_row_per_image dedups by image_name anyway"
"cveta2.dataset_partition.x__latest_task_per_image__mutmut_4" = "_is_deleted=None instead of 0; the column is only ever compared against 1"
"cveta2.dataset_partition.x__latest_task_per_image__mutmut_26" = "ignore_index=None; set_index(\"image_name\") replaces the index next"
"cveta2.dataset_partition.x__latest_task_per_image__mutmut_28" = "drops ignore_index; set_index(\"image_name\") replaces the index next"
"cveta2.dataset_partition.x__latest_task_per_image__mutmut_29" = "ignore_index=False; set_index(\"image_name\") replaces the index next"

# _split_completed: latest_completed is derived from the left frame, so every
# key matches and image_name is the only column the two share.
"cveta2.dataset_partition.x__split_completed__mutmut_16" = "on=None falls back to the shared columns, which is exactly image_name"
"cveta2.dataset_partition.x__split_completed__mutmut_19" = "drops on=; the shared columns are exactly image_name"
"cveta2.dataset_partition.x__split_completed__mutmut_20" = "drops how=\"left\"; an inner join matches every row and keeps left order"

# partition_annotations_df: obsolete is reset_index(drop=True)'d on the way out.
"cveta2.dataset_partition.x_partition_annotations_df__mutmut_57" = "ignore_index=None; the result is reset_index(drop=True)'d before return"
"cveta2.dataset_partition.x_partition_annotations_df__mutmut_59" = "drops ignore_index; the result is reset_index(drop=True)'d before return"
"cveta2.dataset_partition.x_partition_annotations_df__mutmut_60" = "ignore_index=False; the result is reset_index(drop=True)'d before return"

[tool.vulture]
min_confidence = 80
paths = ["cveta2", "main.py"]
exclude = ["cveta2/s3_types.py"]

[tool.coverage.run]
source = ["cveta2"]
branch = true
omit = [
    "cveta2/__main__.py",
    "cveta2/s3_types.py",
    "cveta2/commands/setup_clearml.py",
    "cveta2/commands/ignore.py",
]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.importlinter]
root_packages = ["cveta2"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Core architecture layers"
type = "layers"
layers = [
    "cveta2.cli",
    "cveta2.commands",
    "cveta2.api",
    "cveta2.services",
    "cveta2._clearml",
    "cveta2.client",
    "cveta2._client",
]
[[tool.importlinter.contracts]]
name = "Foundation modules isolation"
type = "forbidden"
source_modules = [
    "cveta2.models",
    "cveta2.exceptions",
]
forbidden_modules = [
    "cveta2.client",
    "cveta2.api",
    "cveta2.services",
    "cveta2.commands",
    "cveta2.cli",
    "cveta2._client",
]

[[tool.importlinter.contracts]]
name = "Config layer isolation"
type = "forbidden"
source_modules = [
    "cveta2.config",
]
forbidden_modules = [
    "cveta2.client",
    "cveta2.api",
    "cveta2.services",
    "cveta2.commands",
    "cveta2.cli",
    "cveta2._client",
    "cveta2.models",
]

[[tool.importlinter.contracts]]
name = "ClearML layer isolation"
type = "forbidden"
source_modules = ["cveta2._clearml"]
forbidden_modules = [
    "cveta2.client",
    "cveta2.commands",
    "cveta2.cli",
    "cveta2._client",
    "cveta2.models",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
